name: "EV Charger Portal"
description: "Payment Manager AddOn for EV Sessions - Uses LAN-local HTTPS portal via MQTT with an HTTPS admin server"
version: "1.1.33"
slug: "ev_portal"
init: false
webui: https://[HOST]:[PORT:8091]/admin
maintainer: 1VTLander
url: "https://github.com/a-1vtlander/ev_payments_service"
documentation: "https://github.com/a-1vtlander/ev_payments_service/blob/main/addons/ev_portal/README.md"

arch:
  - aarch64
  - amd64
  - armhf
  - armv7

ports:
  8090/tcp: 8090
  8091/tcp: 8091
  8092/tcp: 8092
ports_description:
  8090/tcp: "EV Portal guest HTTPS interface"
  8091/tcp: "EV Portal admin HTTPS interface"
  8092/tcp: "EV Portal access key manager (LAN only)"

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  home_id: ""
  charger_id: ""
  default_charger_id: ""
  applepay_domain_association: ""
  filter_access_to: []
  square_sandbox: true
  square_sandbox_app_id: ""
  square_sandbox_access_token: ""
  square_production_app_id: ""
  square_production_access_token: ""
  square_charge_cents: 100
  admin_enabled: true
  admin_username: "admin"
  admin_password: ""
  admin_port_https: 8091
  admin_tls_mode: "self_signed"
  admin_tls_cert_path: ""
  admin_tls_key_path: ""
  # Domain configuration
  ev_portal_domain: ""      # Public hostname of the guest portal (e.g. baselander-ev.extravio.co) — used by keymgr to build the redirect URL after issuing a key
  keymgr_domain: ""         # Hostname of the key manager itself (e.g. keymgr.baselander-ev.extravio.co) — used to obtain a publicly-trusted TLS certificate via DNS-01 ACME
  dns_cloudflare_api_token: ""  # Cloudflare API token with DNS:Edit for the zone above
  dns_cloudflare_zone_id: ""    # Cloudflare zone ID (e.g. a1b2c3…). When set, zone discovery is skipped and the token only needs DNS:Edit. Find it on the zone overview page in the Cloudflare dashboard.
  debug_mode: false

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password
  home_id: str
  charger_id: str
  default_charger_id: str
  applepay_domain_association: str
  filter_access_to:
    - str
  square_sandbox: bool
  square_sandbox_app_id: str
  square_sandbox_access_token: password
  square_production_app_id: str
  square_production_access_token: password
  square_charge_cents: int
  admin_enabled: bool
  admin_username: str
  admin_password: password
  admin_port_https: int
  admin_tls_mode: list(self_signed|provided)
  admin_tls_cert_path: str
  admin_tls_key_path: str
  ev_portal_domain: str
  keymgr_domain: str
  dns_cloudflare_api_token: password
  dns_cloudflare_zone_id: str
  debug_mode: bool
